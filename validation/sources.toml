schema_version = 2

[fixture_families.solar_geometry]
sources = ["nrel_spa", "nrel_spa_pvlib_0152", "spencer_1971"]
generation_method = "Independently computed unrefracted NREL-SPA references using pvlib 0.15.2 (altitude 0 m, pressure 0 Pa); 2 degrees is a conservative selected-Spencer-approximation acceptance bound, not a fitted fixture tolerance."

[fixture_families.psychrometrics]
sources = ["fao56"]
generation_method = "Analytic FAO-56 saturation-vapour-pressure identities."

[fixture_families.physical_kernels]
sources = ["bird_stewart_lightfoot_2002", "kannuluik_carman_1951", "oke_1987"]
generation_method = "Independent direct evaluation of the cited equations."

[fixture_families.liljegren_reference]
sources = ["liljegren_2008", "hall_2022"]
generation_method = "Standalone 256-bit calculation; validation/generate_validation_cases.jl deterministically regenerates only this CSV and never imports HeatStress."

[fixture_families.liljegren_failures]
sources = ["package_contract"]
generation_method = "Declared input and numerical-policy invariants."

[fixture_families.simple_indices]
sources = ["osha_wbgt", "nws_heat_index", "stull_2011", "eccc_humidex"]
generation_method = "Independent 256-bit direct evaluation of the selected equations without importing HeatStress."

[fixture_families.numerical_conformance_v3]
sources = [
    "liljegren_2008",
    "hall_2022",
    "nrel_spa",
    "nrel_spa_pvlib_0152",
    "spencer_1971",
    "fao56",
