owner_spec = "008"
status = "validated"
provenance = "original_design"
rationale = "Locations, pressure and direct fraction may be scalar or row-aligned inputs so fixed stations do not require repeated arrays; direct fraction remains explicit."
implementation = "src/liljegren/batch.jl"
validation = "test/test_liljegren_batch.jl scalar and aligned secondary-input cases"

[items.batch_thread_isolation]
kind = "numerical_policy"
owner_spec = "008"
status = "validated"
provenance = "original_design"
rationale = "Each threaded ordinal iteration owns exactly one output row and reads immutable configuration, preserving serial values without shared counters or scheduling-dependent state."
implementation = "src/liljegren/batch.jl"
validation = "test/test_liljegren_batch.jl complete diagnostic equivalence; .github/workflows/ci.yml 4-thread job"

[items.batch_diagnostic_structure_of_arrays]
kind = "api_design"
owner_spec = "008"
status = "validated"
provenance = "original_design"
rationale = "Row-aligned structure-of-arrays diagnostics avoid returning a heap of per-row diagnostic objects while retaining every scalar diagnostic field."
implementation = "src/types/diagnostics.jl; src/liljegren/batch.jl"
validation = "test/test_liljegren_batch.jl complete serial/threaded component-field equivalence"

[items.batch_pre_mutation_validation]
kind = "api_design"
owner_spec = "008"
status = "validated"
provenance = "original_design"
rationale = "Every input shape, element-type and output-storage condition, including each output length against input rows, is validated before the ordinal loop so invalid calls cannot partially mutate caller storage."
implementation = "src/liljegren/batch.jl; src/types/results.jl"
validation = "test/test_liljegren_batch.jl pre-mutation input, output-length and alias rejection"

[items.batch_all_missing_numeric_vectors]
kind = "api_design"
owner_spec = "008"
status = "validated"
provenance = "original_design"
rationale = "All-missing meteorology, pressure and direct-fraction vectors are valid missing-value inputs; their floating calculation type is inferred from remaining numeric inputs and configuration."
implementation = "src/liljegren/batch.jl"
validation = "test/test_liljegren_batch.jl all-missing meteorology and pressure-vector equivalence"

[items.batch_alias_restrictions]
kind = "api_design"
owner_spec = "008"
status = "validated"
provenance = "original_design"
rationale = "Overlapping output or input storage can corrupt serial results and races under threading, so Base.mightalias rejects it before mutation."
implementation = "src/liljegren/batch.jl"
validation = "test/test_liljegren_batch.jl output-output, output-input and overlapping-view cases"

[items.batch_value_warning_policy]
kind = "api_design"
owner_spec = "008"
status = "validated"
provenance = "original_design"
rationale = "Value-only v0.1 retains missing failures silently and avoids allocating row diagnostics solely to emit an aggregate warning; diagnostic batches provide reasons."
implementation = "src/liljegren/batch.jl; specs/008-batch-interfaces-and-threading/spec.md"
validation = "test/test_liljegren_batch.jl missingness equivalence cases"

[items.batch_allocation_contract]
kind = "api_design"
owner_spec = "008"
status = "validated"
provenance = "original_design"
rationale = "The preallocated API avoids replacement output arrays and public WBGTResult materialisation per row; residual scalar-kernel allocations remain measured rather than assumed fixed."
implementation = "src/liljegren/batch.jl; benchmark/batch_e2e.jl"
validation = "benchmark/batch_e2e.jl comparable modes and allocation measurements"

[items.batch_typed_row_execution]
kind = "api_design"
owner_spec = "008"
status = "validated"
provenance = "original_design"
rationale = "Public scalar and batch entry points share the same promoted typed row calculation so batch execution does not duplicate equations or call a public wrapper per row."
implementation = "src/liljegren/row_execution.jl; src/liljegren/batch.jl"
validation = "test/test_liljegren_batch.jl shared typed row execution and scalar/batch equivalence"

[items.batch_worker_local_preprocessing]
kind = "performance_policy"
owner_spec = "008"
status = "validated"
provenance = "original_design"
rationale = "Solar geometry remains within each ordinal worker iteration to preserve fused threaded scaling and avoid a serial whole-batch preprocessing bottleneck."
implementation = "src/liljegren/row_execution.jl _liljegren_row_from_time; src/liljegren/batch.jl _execute_value_batch!"
validation = "test/test_liljegren_batch.jl threaded equivalence; benchmark/batch_e2e.jl threaded end-to-end mode"

