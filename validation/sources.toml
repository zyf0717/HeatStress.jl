schema_version = 2

[registry]
item_key_format = "lowercase_snake_case"
item_table_format = "items.<item_key>"
source_table_format = "sources.<source_key>"

[registry.item]
required_fields = ["kind", "owner_spec", "status"]
allowed_kinds = [
    "equation",
    "coefficient",
    "physical_constant",
    "model_policy",
    "numerical_policy",
    "api_design",
]
allowed_statuses = ["research", "specified", "implemented", "validated", "superseded"]
owner_spec_format = "three-digit specification identifier, for example 004"
implementation_format = "repository-relative Julia source path"
location_format = "nonempty publication locator, for example equation 6, p. 648"

[registry.item.provenance]
rule = "Exactly one of source or provenance is required."
source = "A key in sources.<source_key>; location is then required."
provenance = "The literal original_design; rationale is then required."

[registry.item.lifecycle]
research = "The provenance rule is satisfied; implementation is optional while a source-file target remains undecided."
specified = "source or provenance fields satisfy the provenance rule; implementation identifies the intended source file."
implemented = "specified requirements plus the implementation path contains the item."
validated = "implemented requirements plus validation identifies committed tests, fixtures, or an invariant."
superseded = "replacement identifies the successor item key and rationale explains the change."

[items]

# Each [items.<item_key>] entry represents exactly one equation, coefficient,
# physical constant, model policy, numerical policy, or API design decision.
#
# Required for every item:
#   kind, owner_spec, status
# Required for sourced items:
#   source, location
# Required for original-design items:
#   provenance = "original_design", rationale
# Required for equation, coefficient, and physical_constant items:
#   units (use "dimensionless" where applicable)
# Required at status = "specified", "implemented", or "validated":
#   implementation
# Required at status = "validated":
#   validation
# Required at status = "superseded":
#   replacement, rationale
#
# An item is entered with status = "specified" before its Julia implementation
# is written. `implementation` names the planned source file at that stage and
# the actual containing file at later stages. `validation` is a
# repository-relative test/fixture path or a named invariant and must state the
# asserted quantity or behavior.

# Example sourced item (not yet selected or populated):
# [items.saturation_vapour_pressure]
# kind = "equation"
# owner_spec = "004"
# source = "liljegren_2008"
# location = "equation/page/section selected during spec 004 research"
# units = "Pa"
# implementation = "src/psychrometrics.jl"
# status = "specified"
#
# Example original-design item (not yet populated):
# [items.root_acceptance_policy]
# kind = "numerical_policy"
# owner_spec = "006"
# provenance = "original_design"
# rationale = "Explain the numerical invariant and rejected alternatives."
# implementation = "src/liljegren/root_solver.jl"
# status = "specified"

[sources.liljegren_2008]
kind = "journal_article"
authors = "Liljegren, J. C.; Carhart, R. A.; Lawday, P.; Tschopp, S.; Sharp, R."
title = "Modeling the Wet Bulb Globe Temperature Using Standard Meteorological Measurements"
journal = "Journal of Occupational and Environmental Hygiene"
year = 2008
volume = "5"
issue = "10"
pages = "645-655"
doi = "10.1080/15459620802310770"
role = "Primary source for the outdoor Liljegren WBGT model"

[sources.bird_stewart_lightfoot_2002]
kind = "book"
authors = "Bird, R. B.; Stewart, W. E.; Lightfoot, E. N."
title = "Transport Phenomena"
publisher = "John Wiley & Sons"
year = "2002"
edition = "2"
role = "Transport-property and convection correlations"

[sources.oke_1987]
kind = "book"
authors = "Oke, T. R."
title = "Boundary Layer Climates"
publisher = "Routledge"
year = "1987"
edition = "2"
role = "Atmospheric emissivity and latent-heat correlation"

[sources.kannuluik_carman_1951]
kind = "journal_article"
authors = "Kannuluik, W. G.; Carman, E. H."
title = "The temperature dependence of the thermal conductivity of air"
year = "1951"
role = "Air thermal-conductivity correlation"

[sources.hall_2022]
kind = "journal_article"
authors = "Hall, A.; et al."
title = "Spatial analysis of outdoor wet bulb globe temperature under RCP4.5 and RCP8.5 scenarios across a range of temperate to hot climates"
journal = "Weather and Climate Extremes"
year = "2022"
volume = "35"
article = "100420"
doi = "10.1016/j.wace.2022.100420"
role = "Independent published transcription of Liljegren balance equations and unit conversions"

[items.atmospheric_emissivity]
kind = "equation"
owner_spec = "005"
status = "validated"
source = "oke_1987"
location = "p. 374, eq. 2"
units = "vapour pressure hPa to dimensionless emissivity"
implementation = "src/heat_transfer.jl"
validation = "test/test_physical_kernels.jl atmospheric-emissivity fixtures"

[items.air_viscosity]
kind = "equation"
owner_spec = "005"
status = "validated"
source = "bird_stewart_lightfoot_2002"
location = "eq. 1.4-14; air Lennard-Jones parameters selected by Liljegren model"
units = "K to Pa s"
implementation = "src/heat_transfer.jl"
validation = "test/test_physical_kernels.jl 270/300/340 K fixtures"

[items.air_thermal_conductivity]
kind = "equation"
owner_spec = "005"
status = "validated"
source = "kannuluik_carman_1951"
location = "temperature correlation; CGS-to-SI conversion reproduced by Hall et al. (2022), eq. 10"
units = "K to W m^-1 K^-1"
implementation = "src/heat_transfer.jl"
validation = "test/test_physical_kernels.jl 270/300/340 K fixtures"

[items.air_diffusivity]
kind = "equation"
owner_spec = "005"
status = "validated"
source = "bird_stewart_lightfoot_2002"
location = "eq. 17.2-1; SI conversion documented by Hall et al. (2022), eq. 14"
units = "K and hPa to m^2 s^-1"
implementation = "src/heat_transfer.jl"
validation = "test/test_physical_kernels.jl 270/300/340 K fixtures"

[items.sphere_convection]
kind = "equation"
owner_spec = "005"
status = "validated"
source = "bird_stewart_lightfoot_2002"
location = "eqs. 14.2-3 and 14.4-5"
units = "K, hPa, m s^-1 and m to W m^-2 K^-1"
implementation = "src/heat_transfer.jl"
validation = "test/test_physical_kernels.jl zero/low/ordinary-wind fixtures"

[items.cylinder_convection]
kind = "equation"
owner_spec = "005"
status = "validated"
source = "liljegren_2008"
location = "eq. 10"
units = "K, hPa, m s^-1 and m to W m^-2 K^-1"
implementation = "src/heat_transfer.jl"
validation = "test/test_physical_kernels.jl zero/low/ordinary-wind fixtures"

[items.globe_balance]
kind = "equation"
owner_spec = "005"
status = "validated"
source = "hall_2022"
location = "eqs. 21-23, transcribing Liljegren globe balance"
units = "K^4 root residual and K fixed-point acceptance residual"
implementation = "src/liljegren/residuals.jl"
validation = "test/test_physical_kernels.jl raw-radicand and fixed-point residual fixtures"

[items.wet_bulb_balance]
kind = "equation"
owner_spec = "005"
status = "validated"
source = "hall_2022"
location = "eqs. 6, 16, 18-20, transcribing Liljegren wick balance"
units = "K signed residual"
implementation = "src/liljegren/residuals.jl"
validation = "test/test_physical_kernels.jl wet-bulb residual sign brackets"

[items.direct_solar_elevation_clip]
kind = "numerical_policy"
owner_spec = "005"
status = "validated"
provenance = "original_design"
rationale = "Direct horizontal-to-normal geometry is singular at the horizon while the API does not provide direct-normal irradiance; 1 degree bounds both shared direct terms while retaining diffuse forcing and distinguishing physical night zeroing."
implementation = "src/constants.jl; src/liljegren/residuals.jl"
validation = "test/test_physical_kernels.jl direct-forcing threshold and horizon boundaries"
