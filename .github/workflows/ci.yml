name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Julia ${{ matrix.version }} / ${{ matrix.threads }} threads
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            version: '1.10'
            threads: 1
          - os: ubuntu-latest
            version: '1.10'
            threads: 4
          - os: ubuntu-latest
            version: '1'
            threads: 1
          - os: ubuntu-latest
            version: '1'
            threads: 4
          - os: macos-latest
            version: '1'
            threads: 1
          - os: windows-latest
            version: '1'
            threads: 1
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      HEATSTRESS_EXPECT_MULTITHREADED: ${{ matrix.threads == 4 && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - name: Test
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  quality:
    name: Julia ${{ matrix.version }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    env:
      JULIA_NUM_THREADS: '1'
      HEATSTRESS_QUALITY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - name: Quality
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Build documentation
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()' && julia --project=docs docs/make.jl

  benchmark-smoke:
    name: Benchmark output smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Validate benchmark outputs
        run: julia --project=benchmark -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()' && julia --project=benchmark benchmark/batch_e2e.jl --rows=100 --samples=1 && julia --project=benchmark benchmark/solar_geometry_e2e.jl

  clean-depot-smoke:
    name: Clean-depot install and load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Instantiate, precompile, import, and run public quick start
        shell: bash
        run: |
          depot="$(mktemp -d)"
          JULIA_DEPOT_PATH="$depot" julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.precompile()
            using HeatStress, Dates
            result = liljegren_wbgt(
                30.0, 20.0, 1.0, 800.0,
                DateTime(2024, 6, 21, 12), 0.0, 0.0;
                pressure_hpa = 1010.0,
                direct_fraction = 0.7,
            )
            @assert !ismissing(result.wbgt_c)
          '
